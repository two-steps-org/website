    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://twosteps.ai/#organization",
            "name": "Two Steps AI",
            "alternateName": "Two Steps",
            "url": "https://twosteps.ai",
            "logo": {
              "@type": "ImageObject",
              "url": "https://twosteps.ai/Icon - Two Steps.png",
              "width": 512,
              "height": 512
            },
            "description": "Two Steps is an AI studio building custom systems for companies with a standard to protect. Delivered for EY and Bulthaup.",
            "slogan": "Two Steps — AI systems, built to a standard.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Tel Aviv",
              "addressCountry": "IL"
            },
            "contactPoint": [{
              "@type": "ContactPoint",
              "telephone": "+972-54-4831148",
              "contactType": "customer service",
              "email": "yoni.insell@twosteps.ai",
              "availableLanguage": ["English", "Hebrew"]
            }],
            "sameAs": [
              "https://www.facebook.com/twostepsai",
              "https://x.com/twostepsai",
              "https://www.linkedin.com/company/two-steps-ai/",
              "https://www.instagram.com/twostepsai"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "AI Services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Chat Agents", "description": "An agent that owns a conversation end to end — understands what's being asked, decides what to do, and does it. It reads your systems, takes the action, and hands off to a person when a person is genuinely needed.", "provider": { "@id": "https://twosteps.ai/#organization" } } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Voice Agents", "description": "We build voice agents around a role rather than a script: inbound discovery, customer success, win-back, the operator who never misses a call. Each one knows what it's for, what it's allowed to do, and when to pass the call to a person.", "provider": { "@id": "https://twosteps.ai/#organization" } } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "CRM Development", "description": "Most companies bend their process to fit the software. We build the software around the process — the pipeline as you actually run it, the fields you actually use, the reports you actually read.", "provider": { "@id": "https://twosteps.ai/#organization" } } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom SaaS Solutions", "description": "Phyizit and Shift Manager started as blank files. We designed them, built them, shipped them and still run them.", "provider": { "@id": "https://twosteps.ai/#organization" } } }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://twosteps.ai/#website",
            "name": "Two Steps AI",
            "url": "https://twosteps.ai",
            "description": "Two Steps is an AI studio building custom systems for companies with a standard to protect. Delivered for EY and Bulthaup.",
            "publisher": { "@id": "https://twosteps.ai/#organization" }
          },
          {
            "@type": "WebPage",
            "@id": "https://twosteps.ai/#webpage",
            "url": "https://twosteps.ai/",
            "name": "Two Steps AI — AI Chat Agents, AI Voice Agents, CRM Development, Custom SaaS",
            "description": "Two Steps is an AI studio building custom systems for companies with a standard to protect. Delivered for EY and Bulthaup.",
            "inLanguage": "en-US",
            "isPartOf": { "@id": "https://twosteps.ai/#website" },
            "about": { "@id": "https://twosteps.ai/#organization" }
          },
          {
            "@type": "FAQPage",
            "@id": "https://twosteps.ai/#faq",
            "mainEntity": [
              { "@type": "Question", "name": "Is my business the right fit for AI solutions?", "acceptedAnswer": { "@type": "Answer", "text": "If you want to streamline operations, enhance customer experiences, or stay ahead of the competition, then yes! At Two Steps, we craft AI solutions tailored specifically to your business's needs." } },
              { "@type": "Question", "name": "How do I know which AI solution is right for my business?", "acceptedAnswer": { "@type": "Answer", "text": "You don't need to know—we'll guide you. Our free consultation is designed to uncover your needs and recommend the ideal solution for your business." } },
              { "@type": "Question", "name": "What industries do you work with?", "acceptedAnswer": { "@type": "Answer", "text": "From retail to healthcare, real estate, and beyond, we deliver AI solutions tailored to diverse industries. If your business has processes, we can automate and optimize them." } },
              { "@type": "Question", "name": "What makes your team different from other AI agencies?", "acceptedAnswer": { "@type": "Answer", "text": "We don't just build AI—we build relationships. Our team works closely with you to design solutions that align perfectly with your goals." } },
              { "@type": "Question", "name": "How do you ensure the AI solution will deliver results?", "acceptedAnswer": { "@type": "Answer", "text": "Our solutions are custom-made for your business, rigorously tested, and optimized for real-world results. You'll quickly see how they save time, reduce costs, and make your operations more efficient." } },
              { "@type": "Question", "name": "Can AI solutions work with the tools/software I already use?", "acceptedAnswer": { "@type": "Answer", "text": "Absolutely. Our custom AI solutions integrate seamlessly with your existing platforms, whether it's a CRM, email system, or other internal tools." } }
            ]
          }
        ]
